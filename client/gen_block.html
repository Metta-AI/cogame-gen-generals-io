<!--
     GEN-GENERALS-IO additions to the inherited coworld-ctf chrome
     ==============================================================
     Everything above this banner is the starter's page, with the elements
     the design note lists as removed deleted (#viewpanel, #fpv*, #povBadge,
     the ctf scorebug internals, the beat CSS kinds this game never emits)
     and the endcard/label re-mappings applied in place. Everything this game
     adds lives below it: the scorebug plate contents, the fog-lens chip row,
     the growth bar, the feed rows, the beat rendering and the endcard
     columns.

     Nothing here is positioned inside the transport band: the fog lens and
     the growth bar sit in the TOP band, the feed and the banners inside the
     board region, and the endcard stops at var(--band) (the starter's rule).
-->
<style>
/* ---- scorebug plate contents ---------------------------------------- */
.plate-name { flex: 1 1 auto; min-width: 3.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.land-num {
  font-variant-numeric: tabular-nums;
  font-size: calc(20 * var(--u));
  font-weight: 700;
  line-height: 1;
  color: var(--paper);
}
.land-label {
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper-dim);
  opacity: 0.75;
}
.plate-sub {
  display: flex;
  gap: calc(4 * var(--u));
  align-items: center;
  font-size: calc(8 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.plate.out { opacity: 0.4; }
.plate .fbglyph { color: var(--amber); }
@media (max-width: 640px) {
  .land-label { display: none; }
}

/* ---- fog lens + growth bar (TOP band, never the transport band) ------ */
#genband {
  position: absolute;
  left: 0; right: 0;
  top: var(--topband, 0px);
  display: flex;
  gap: calc(6 * var(--u));
  align-items: center;
  justify-content: center;
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  pointer-events: auto;
  z-index: 6;
  font-size: calc(8 * var(--u));
  color: var(--paper-dim);
}
.fogchip {
  display: inline-flex;
  align-items: center;
  gap: calc(2 * var(--u));
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  border: 1px solid rgba(242, 232, 216, 0.22);
  border-radius: calc(2 * var(--u));
  background: rgba(0, 0, 0, 0.28);
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.fogchip .swatch {
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 1px;
  display: inline-block;
}
.fogchip.on { border-color: var(--amber); color: var(--paper); }
.fogchip.out { opacity: 0.35; }
@media (max-width: 640px) {
  .fogchip .word { display: none; }
}
#growthbar {
  position: relative;
  width: calc(90 * var(--u));
  height: calc(5 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: 1px;
  overflow: hidden;
}
#growthbar i {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--amber);
  opacity: 0.55;
}
#growthread { letter-spacing: 0.06em; text-transform: uppercase; }
#stacktop {
  font-size: calc(8 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  text-align: center;
  white-space: nowrap;
}
#foglens-canvas {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ---- the four beat kinds this game emits, and no others -------------- */
.beat-marker.citytaken { background: var(--tc, var(--paper-dim)); height: calc(6 * var(--u)); }
.beat-marker.generalspotted { background: var(--tc, var(--paper)); height: calc(8 * var(--u)); opacity: 0.7; }
.beat-marker.generalcaptured { background: var(--tc, var(--amber)); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
.beat-marker.end { background: var(--paper); width: calc(2 * var(--u)); height: calc(12 * var(--u)); }

/* ---- endcard columns -------------------------------------------------- */
.ec-thead, .ec-row { display: grid; grid-template-columns: 2.2fr repeat(4, 0.6fr); gap: calc(3 * var(--u)); align-items: baseline; }
.ec-alias { opacity: 0.55; font-size: calc(7 * var(--u)); }
.ec-row .n { font-variant-numeric: tabular-nums; text-align: right; }
.ec-out { opacity: 0.45; }
</style>
<script>
// GEN-GENERALS-IO game block. It owns the scorebug plate contents, the fog
// lens, the growth bar, the match feed, the banners, the scrubber beats and
// the endcard; the chrome above owns everything else.
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TEAMS = ['red', 'blue', 'green', 'yellow'];
  var TEAM_COLOR = { red: '#e0523a', blue: '#3f7cc4', green: '#45a85e', yellow: '#ddc531' };
  var WIRE = window.GEN_WIRE || {};
  // The context the classic chrome hands this block (its `send`, `pushFeed`,
  // `banner`, `esc` and `getState`). The game block must not re-implement
  // naming, escaping, feed insertion or the transport.
  var CTX = null;
  function install(ctx) { if (ctx) CTX = ctx; }
  var ALIASES = WIRE.aliases || ['RED-alpha', 'BLUE-alpha', 'GREEN-alpha', 'YELLOW-alpha'];

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shortName(n) {
    n = String(n || '');
    var at = n.indexOf('@');
    if (at > 0) n = n.slice(0, at);
    return n || '?';
  }
  // Named with the gen prefix: `teamName` is one of the identifiers the
  // chrome alias block hoists, and a game-block redefinition would shadow it
  // (the tandem 2026-08-23 hoisting trap).
  function genTeam(seat) { return TEAMS[seat] || 'red'; }
  function upper(seat) { return String(TEAMS[seat] || '').toUpperCase(); }

  // ---- the top band: fog lens + growth bar ------------------------------
  var band = document.createElement('div');
  band.id = 'genband';
  var lensSeat = -1;          // -1 = ALL
  var chips = [];
  (function buildBand() {
    var all = document.createElement('span');
    all.className = 'fogchip on';
    all.innerHTML = '<span class="word">All</span><span class="swatch" style="background:#f2e8d8"></span>';
    all.title = 'Show the whole board';
    all.setAttribute('aria-label', 'Fog lens: show the whole board');
    all.addEventListener('click', function () { setLens(-1); });
    band.appendChild(all);
    chips.push(all);
    for (var seat = 0; seat < 4; seat++) {
      (function (s) {
        var chip = document.createElement('span');
        chip.className = 'fogchip';
        chip.innerHTML = '<span class="swatch" style="background:' + TEAM_COLOR[TEAMS[s]] + '"></span>' +
          '<span class="word">' + upper(s) + '</span>';
        chip.title = 'Fog lens: see the board as ' + ALIASES[s] + ' sees it';
        chip.setAttribute('aria-label', chip.title);
        chip.addEventListener('click', function () { setLens(s); });
        band.appendChild(chip);
        chips.push(chip);
      })(seat);
    }
    var bar = document.createElement('div');
    bar.id = 'growthbar';
    bar.innerHTML = '<i style="width:0%"></i>';
    band.appendChild(bar);
    var read = document.createElement('span');
    read.id = 'growthread';
    read.textContent = 'GROWTH IN —';
    band.appendChild(read);
    var chrome = $('chrome');
    if (chrome) chrome.appendChild(band);
    var clockCol = document.querySelector('.clock-col');
    if (clockCol) {
      var stack = document.createElement('div');
      stack.id = 'stacktop';
      clockCol.appendChild(stack);
    }
  })();

  function setLens(seat) {
    lensSeat = seat;
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('on', (i - 1) === seat || (seat < 0 && i === 0));
    }
    drawFogLens();
  }

  // ---- the board model, derived in the browser from `cells` -------------
  var boardW = 0, boardH = 0;
  var kinds = [], owners = [], armies = [];
  var everSeen = [];          // per seat: accumulated "has ever been seen"
  var transform = null;

  function ensureBoard(s) {
    if (!(s.w > 0) || !(s.h > 0)) return;
    if (boardW === s.w && boardH === s.h) return;
    boardW = s.w; boardH = s.h;
    var n = boardW * boardH;
    kinds = new Array(n); owners = new Array(n); armies = new Array(n);
    everSeen = [];
    for (var seat = 0; seat < 4; seat++) everSeen.push(new Uint8Array(n));
    for (var i = 0; i < n; i++) { kinds[i] = 'plain'; owners[i] = -1; armies[i] = 0; }
  }

  function applyCells(s) {
    if (!s.cells) return;
    for (var i = 0; i < s.cells.length; i++) {
      var c = s.cells[i];
      kinds[c.i] = c.k; owners[c.i] = c.o; armies[c.i] = c.a;
    }
  }

  // visible[seat] = owned U 8-neighbours(owned), exactly as the sim derives
  // it. The per-seat fog is NOT transmitted: this costs zero replay bytes and
  // cannot drift.
  function visibleFor(seat) {
    var n = boardW * boardH;
    var vis = new Uint8Array(n);
    for (var cell = 0; cell < n; cell++) {
      if (owners[cell] !== seat) continue;
      vis[cell] = 1;
      var x = cell % boardW, y = (cell / boardW) | 0;
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          var nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= boardW || ny >= boardH) continue;
          vis[ny * boardW + nx] = 1;
        }
      }
    }
    return vis;
  }

  function fogCanvas() {
    var pool = $('lightpool');
    if (!pool) return null;
    var canvas = $('foglens-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'foglens-canvas';
      pool.appendChild(canvas);
    }
    return canvas;
  }

  function drawFogLens() {
    var canvas = fogCanvas();
    if (!canvas || !boardW) return;
    var pool = $('lightpool');
    var w = pool.clientWidth, h = pool.clientHeight;
    if (!(w > 0) || !(h > 0)) return;
    var dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr)) canvas.width = Math.round(w * dpr);
    if (canvas.height !== Math.round(h * dpr)) canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (lensSeat < 0 || !transform || !(transform.scale > 0)) return;
    var vis = visibleFor(lensSeat);
    var seen = everSeen[lensSeat];
    for (var cell = 0; cell < vis.length; cell++) if (vis[cell]) seen[cell] = 1;
    var cellPx = (WIRE.cellPx || 40) * transform.scale;
    var ox = transform.offsetX, oy = transform.offsetY;
    for (var i = 0; i < vis.length; i++) {
      if (vis[i]) continue;
      var x = ox + (i % boardW) * cellPx;
      var y = oy + (((i / boardW) | 0)) * cellPx;
      ctx.fillStyle = seen[i] ? 'rgba(6, 8, 12, 0.55)' : 'rgba(6, 8, 12, 0.86)';
      ctx.fillRect(x, y, cellPx + 0.5, cellPx + 0.5);
      if (!seen[i]) {
        ctx.fillStyle = 'rgba(242, 232, 216, 0.10)';
        for (var sy = 2; sy < cellPx; sy += 6) ctx.fillRect(x + 2, y + sy, cellPx - 4, 1);
      }
    }
  }

  // ---- scrubber beats: labelled, clickable buttons ----------------------
  // Named genBeat so it can never be shadowed by the hoisted alias the shared
  // chrome declares for its own beat builder (the tandem 2026-08-23 hoisting
  // trap: a game-block redefinition wins, and the markers then render as
  // unlabelled divs that never seek).
  var genSeen = {};
  function genBeat(tick, kind, seat, label) {
    var key = tick + '|' + kind + '|' + seat;
    if (genSeen[key]) return;
    genSeen[key] = true;
    var scrub = $('scrub');
    if (!scrub) return;
    var state = CTX ? CTX.getState() : null;
    var st = state ? Math.max(0, state.st || 0) : 0;
    var mx = state ? Math.max(st + 1, state.mx || 1) : 1;
    var frac = Math.min(1, Math.max(0, (tick - st) / (mx - st)));
    var button = document.createElement('button');
    button.className = 'beat-marker ' + kind + (seat >= 0 ? ' ' + genTeam(seat) : '');
    button.style.left = (frac * 100) + '%';
    if (seat >= 0) button.style.setProperty('--tc', TEAM_COLOR[genTeam(seat)]);
    button.title = label;
    button.setAttribute('aria-label', label);
    button.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (CTX) CTX.send('s:' + tick);
    });
    scrub.appendChild(button);
  }

  // ---- the match feed and the banners -----------------------------------
  function cellText(cell) {
    return '(' + (cell % boardW) + ',' + (((cell / boardW) | 0)) + ')';
  }

  function feedRow(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    if (CTX) CTX.pushFeed(row);
  }

  function who(seat) {
    return '<span class="who ' + genTeam(seat) + '">' + esc(upper(seat)) + '</span>';
  }

  function event(e, s, ctx) {
    install(ctx);
    switch (e.k) {
      case 'citytaken':
        feedRow(who(e.seat) + '<span class="glyph">&#9670;</span><span class="badge">takes the city at ' +
          cellText(e.cell) + ' for ' + (e.cost || 0) + '</span>');
        genBeat(s.t, 'citytaken', e.seat, upper(e.seat) + ' takes the city at ' + cellText(e.cell));
        return true;
      case 'generalspotted':
        feedRow(who(e.seat) + '<span class="glyph">&#128065;</span><span class="badge">SEES ' +
          esc(upper(e.victim)) + "'S CROWN at " + cellText(e.cell) + '</span>', 'flagkill');
        genBeat(s.t, 'generalspotted', e.seat,
          upper(e.seat) + " sees " + upper(e.victim) + "'s crown");
        return true;
      case 'generalcaptured':
        if (CTX) {
          CTX.banner(upper(e.seat) + " TAKES " + upper(e.victim) + "'S CROWN — inherits " +
            (e.landGained || 0) + ' tiles and ' + (e.armyGained || 0) + ' armies',
            'wipe accent ' + genTeam(e.seat));
        }
        genBeat(s.t, 'generalcaptured', e.seat,
          upper(e.seat) + " takes " + upper(e.victim) + "'s crown");
        return true;
      case 'eliminated':
        if (CTX) {
          CTX.banner(upper(e.seat) + ' IS ELIMINATED (turn ' + (e.turn || 0) + ')',
            'steal accent ' + genTeam(e.seat));
        }
        return true;
      case 'growth':
        var parts = [];
        for (var seat = 0; seat < 4; seat++) {
          if (e.land && e.land[seat] > 0) parts.push(upper(seat) + ' +' + e.land[seat]);
        }
        if (CTX) {
          CTX.banner('GROWTH — every tile +1 · ' + parts.join(' '), 'returned accent');
        }
        return true;
      case 'stackclash':
        feedRow(who(e.attacker) + '<span class="glyph">&#8594;</span>' +
          (e.defender >= 0 ? who(e.defender) : '<span class="who">neutral</span>') +
          '<span class="badge">' + (e.attackerArmy || 0) + ' against ' + (e.defenderArmy || 0) + '</span>');
        return true;
      case 'claim':
      case 'tilelost':
        return true;
      case 'plan':
        if (e.note) {
          feedRow('<span class="who ' + genTeam(e.seat) + '">' + esc(ALIASES[e.seat]) +
            '</span><span class="badge">&ldquo;' + esc(e.note) + '&rdquo;</span>');
        }
        return true;
      case 'end':
        genBeat(s.t, 'end', -1, 'Final turn');
        return true;
      default:
        return false;
    }
  }

  // ---- the scorebug plate contents --------------------------------------
  function scorebug(s) {
    var stand = s.stand || { land: [0, 0, 0, 0], army: [0, 0, 0, 0], cities: [0, 0, 0, 0] };
    var teams = s.teams || {};
    var tiny = document.getElementById('stage');
    var isTiny = tiny && tiny.classList.contains('tiny');
    for (var seat = 0; seat < 4; seat++) {
      var team = genTeam(seat);
      var nameEl = $('name-' + team);
      var landEl = $('land-' + team);
      var subEl = $('sub-' + team);
      var plate = document.querySelector('.plate[data-team="' + team + '"]');
      var roster = (s.roster || []).filter(function (p) { return p.s === seat; })[0];
      if (nameEl && roster) nameEl.textContent = shortName(roster.name);
      if (landEl) landEl.textContent = String(stand.land[seat]);
      var alive = s.alive ? s.alive[seat] : true;
      var fallbacks = (teams[team] && teams[team].fallbacks) || 0;
      if (subEl) {
        if (!alive) {
          subEl.textContent = 'out t' + ((s.out && s.out[seat] >= 0) ? s.out[seat] : '?');
        } else if (isTiny) {
          subEl.innerHTML = fallbacks > 0 ? '<span class="fbglyph">&#8623;</span>' : '';
        } else {
          subEl.innerHTML = esc(stand.army[seat] + ' army · ' + stand.cities[seat] + ' cities') +
            (fallbacks > 0 ? ' <span class="fbglyph" title="took a scripted fallback">&#8623;</span>' : '');
        }
      }
      if (plate) {
        plate.classList.toggle('out', !alive);
        plate.classList.toggle('leader', alive && isLeader(stand.land, seat));
      }
    }
    var stack = $('stacktop');
    if (stack) {
      var bits = [];
      for (var i = 0; i < 4; i++) {
        if (!s.alive || s.alive[i]) bits.push(upper(i).charAt(0) + ' ' + stand.army[i]);
      }
      stack.textContent = isTiny ? bits.join(' · ') : '';
    }
  }

  function isLeader(land, seat) {
    for (var i = 0; i < 4; i++) if (i !== seat && land[i] >= land[seat]) return false;
    return true;
  }

  // ---- the clock, the growth bar and the frame hook ----------------------
  // The pre-scan ships the whole beat timeline on the first frame, so the
  // scrubber draws at FULL WIDTH immediately instead of growing in.
  var beatsIngested = false;
  function ingestBeatTimeline(s) {
    if (beatsIngested || !s.beats) return;
    beatsIngested = true;
    for (var i = 0; i < s.beats.length; i++) {
      var b = s.beats[i];
      var seat = (b.seat != null && b.seat >= 0) ? b.seat : -1;
      if (b.k === 'citytaken') genBeat(b.t, 'citytaken', seat, upper(seat) + ' takes a city');
      else if (b.k === 'generalspotted') genBeat(b.t, 'generalspotted', seat, upper(seat) + ' finds a crown');
      else if (b.k === 'generalcaptured') genBeat(b.t, 'generalcaptured', seat, upper(seat) + ' takes a crown');
      else if (b.k === 'end') genBeat(b.t, 'end', -1, 'Final turn');
    }
  }

  function frame(s, ctx, jumped) {
    install(ctx);
    ensureBoard(s);
    ingestBeatTimeline(s);
    if (jumped) {
      // A seek re-bases the board: the next frame carries the full array.
      for (var i = 0; i < kinds.length; i++) { kinds[i] = 'plain'; owners[i] = -1; armies[i] = 0; }
    }
    applyCells(s);
    var timeEl = $('clock-time');
    var capEl = $('clock-caption');
    if (timeEl && s.ph === 'playing') {
      timeEl.textContent = 'TURN ' + (s.turn || 0) + ' / ' + (s.turns || 0);
    }
    if (capEl && s.ph === 'playing') {
      var standing = 0;
      var best = 0, bestSeat = 0;
      var stand = s.stand || { land: [0, 0, 0, 0] };
      for (var seat = 0; seat < 4; seat++) {
        if (!s.alive || s.alive[seat]) standing++;
        if (stand.land[seat] > best) { best = stand.land[seat]; bestSeat = seat; }
      }
      var plan = Math.floor((s.turn || 0) / 8) + 1;
      var plans = Math.ceil((s.turns || 240) / 8);
      capEl.textContent = 'plan ' + plan + '/' + plans + ' · ' + standing +
        ' crowns standing · ' + upper(bestSeat) + ' leads ' + best + ' land';
    }
    var bar = $('growthbar');
    var read = $('growthread');
    if (bar && read && s.growthEvery > 0) {
      var into = s.growthEvery - (s.growthIn || s.growthEvery);
      bar.firstChild.style.width = Math.round(100 * into / s.growthEvery) + '%';
      read.textContent = 'GROWTH IN ' + (s.growthIn || 0);
    }
    for (var seat2 = 0; seat2 < 4; seat2++) {
      if (chips[seat2 + 1]) {
        chips[seat2 + 1].classList.toggle('out', !!(s.alive && !s.alive[seat2]));
      }
    }
    drawFogLens();
  }

  function transformUpdate(t) {
    transform = t || null;
    drawFogLens();
  }

  // ---- the endcard -------------------------------------------------------
  function endcard(s) {
    var o = s.over;
    if (!o) return;
    var wrap = $('ec-teams');
    var head = $('ec-headline');
    var how = $('ec-how');
    var cond = $('ec-wincond');
    var stand = s.stand || { land: [0, 0, 0, 0], army: [0, 0, 0, 0], cities: [0, 0, 0, 0] };
    var key = [s.t, o.winner, o.draw, o.endRule].join('|');
    if (wrap && wrap._key !== key) {
      wrap._key = key;
      // ONE four-seat table under the re-mapped header, not one panel per
      // team: four stacked panels do not fit a 360 px embed.
      var html = '<div class="ec-team" id="ec-team-all">' +
        '<div class="ec-thead"><span>Commander</span><span>Land</span>' +
        '<span>Army</span><span>Cities</span><span>Crowns</span></div>';
      var order = [0, 1, 2, 3].sort(function (a, b) {
        return ((o.rank && o.rank[a] != null) ? o.rank[a] : a) -
               ((o.rank && o.rank[b] != null) ? o.rank[b] : b);
      });
      for (var idx = 0; idx < order.length; idx++) {
        var seat = order[idx];
        var team = genTeam(seat);
        var roster = (s.roster || []).filter(function (p) { return p.s === seat; })[0];
        var alive = s.alive ? s.alive[seat] : true;
        var crowns = 0;
        for (var v = 0; v < 4; v++) if (s.outBy && s.outBy[v] === seat) crowns++;
        html += '<div class="ec-row' + (alive ? '' : ' ec-out') +
          (o.winner === team ? ' mvp' : '') + '">' +
          '<span class="pcell"><span class="pname ' + team + '">' +
          esc(roster ? shortName(roster.name) : upper(seat)) + '</span>' +
          '<span class="ec-alias"> ' + esc(ALIASES[seat]) +
          (alive ? '' : ' · out t' + ((s.out && s.out[seat] >= 0) ? s.out[seat] : '?')) +
          '</span></span>' +
          '<span class="n">' + stand.land[seat] + '</span>' +
          '<span class="n">' + stand.army[seat] + '</span>' +
          '<span class="n">' + stand.cities[seat] + '</span>' +
          '<span class="n">' + crowns + '</span>' +
          '</div>';
      }
      wrap.innerHTML = html + '</div>';
    }
    if (cond) {
      cond.textContent =
        o.endRule === 'conquest' ? 'LAST CROWN STANDING' :
        o.endRule === 'wall_clock' ? 'WALL-CLOCK STOP' :
        (o.endRule === 'sim_fault' || o.endRule === 'host_error') ? 'FAULT — NO RESULT' :
        'FULL TIME — RANKED ON LAND';
    }
    if (head) {
      if (o.draw) {
        head.className = 'headline draw';
        head.textContent = 'DEAD EVEN';
      } else {
        var seatIndex = TEAMS.indexOf(o.winner);
        var rosterWin = (s.roster || []).filter(function (p) { return p.s === seatIndex; })[0];
        head.className = 'headline ' + o.winner;
        head.textContent = 'GENERALS — ' +
          esc(rosterWin ? shortName(rosterWin.name).toUpperCase() : upper(seatIndex)) + ' WINS';
      }
    }
    if (how) {
      var crowns = 0;
      for (var i = 0; i < 4; i++) if (s.out && s.out[i] >= 0) crowns++;
      how.textContent = crowns > 0
        ? crowns + ' crown' + (crowns === 1 ? '' : 's') + ' fell; the survivors were ranked on land, then army, then cities.'
        : 'No crown fell: the clock ran out and the ranking is land, then army, then cities.';
    }
  }

  window.GenGeneralsChrome = {
    install: install,
    frame: frame,
    event: event,
    scorebug: scorebug,
    endcard: endcard,
    transform: transformUpdate,
    beat: genBeat
  };
  window.addEventListener('resize', drawFogLens);
})();
</script>
