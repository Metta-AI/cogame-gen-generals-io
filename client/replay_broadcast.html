@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .plate-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .plate-line { flex-direction: row-reverse; }
.land-num {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  line-height: 1;
  color: var(--paper);
  flex: none;
}
.land-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3 */
.plate.leader .land-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .land-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* a 4-team match can retire several rival hearts (GV32: a capture eliminates
   its team and play continues), so the Cap cell lays its hearts in a row,
   later hearts shingling over earlier ones so three still fit the column */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

#endcard .ec-row .n.clstr { color: var(--amber); }
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four commanders reading their maps
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .land-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain: the bot locker room. The six art frames (srcs set by
       buildLockerRoom — the path prefix is delivery-mode dependent) play as a
       ~4fps idle loop; the whole scene fades out on the first ingested
       frame (dismissLockerRoom). role=status so screen readers hear one
       "Loading replay" while the visual squad preps their markers. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Raising the standards&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Bot locker room &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Plates are generated per active team (2-4) by ensureScorebug(): one
         per side for classic red/blue, two stacked per side for 3-4 teams.
         Each plate holds a flag icon, one inline NAME · Lives · count row
         (mirrored on the right so names flank the clock), and the squad pip
         strip (one pip per player: alive / down / eliminated; clickable →
         POV lens). -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Four crowns, one map</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded plans</div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: cities / crowns found / crowns taken / winner on the timeline (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">LAND</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // Shared replay chrome (chrome_common.js, spliced over the CHROME_COMMON
  // marker by the server / dist bundle; the literal marker must not appear
  // inside this script or the splice would corrupt it). A raw file:// open of
  // this source has no splice — same non-functional baseline as the missing
  // BROADCAST_CORE — so fail loud and early instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    sendPov: function (slot) { send('v:' + slot); },
    getState: function () { return lastState; }
  });
  // Aliases so the per-view code below reads exactly as before.
  var RED = C.RED, BLUE = C.BLUE, AMBER = C.AMBER, PAPER = C.PAPER;
  var GREEN = C.GREEN, YELLOW = C.YELLOW;
  var TEAM_ORDER = C.TEAM_ORDER, TEAM_COLOR = C.TEAM_COLOR;
  var teamCol = C.teamCol, activeTeams = C.activeTeams, teamOf = C.teamOf;
  var otherTeam = C.otherTeam, stripSeatSuffix = C.stripSeatSuffix;
  var teamPolicies = C.teamPolicies, teamName = C.teamName, teamHeadline = C.teamHeadline;
  var rosterName = C.rosterName, setName = C.setName, esc = C.esc, fmt = C.fmt;
  var setHandicap = C.setHandicap;
  var teamPerkGroups = C.teamPerkGroups, perkIconsHtml = C.perkIconsHtml;
  var togglePov = C.togglePov, renderClock = C.renderClock, renderTransport = C.renderTransport;
  var ingestLullSpans = C.ingestLullSpans, renderLullSpans = C.renderLullSpans;
  var markBeat = C.markBeat, killMarkerTeam = C.killMarkerTeam, renderBeatMarkers = C.renderBeatMarkers;
  var captureTeam = C.captureTeam, ingestBeats = C.ingestBeats, setVerdict = C.setVerdict;
  var ingestLeadSeries = C.ingestLeadSeries, recordMomentum = C.recordMomentum;
  var renderMomentum = C.renderMomentum;
  var getSpoilers = C.getSpoilers, setSpoilers = C.setSpoilers;

  // ---- where this page's static art lives ----
  // COG_BASE, not a root-absolute "/client/…": this page is served from THREE
  // places and a leading slash is only correct at one of them.
  //  - native server, bare:      /client/replay        → "" + /client/…
  //  - native server, proxied:   /<prefix>/client/replay (Kubernetes service
  //    proxy) — a leading slash would drop <prefix> and 404.
  //  - the STATIC WASM BUNDLE:   /v2/coworlds/replays/static/<coworld>/<hash>/
  //    index.html, where the PNGs sit NEXT TO the page and there is no server
  //    at all — a leading slash resolves to the API origin root and 404s.
  // Stripping the trailing "/client/<page>" recovers the prefix, so the same
  // expression serves all three. Mirrors ART_BASE in league_replayer.html and
  // websocketPathForClientPage() in broadcast_core.js, which map the same
  // /client + /clients route pair the same way. The bundle is detected by its
  // WASM adapter rather than a URL param: window.GenStaticReplay only exists
  // when static_replay.js is on the page.
  var COG_BASE = window.GenStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';
  // Engine-authoritative wire constants (read via the shared chrome; the
  // fallback literals for raw file:// opens live in chrome_common.js).
  var WIRE = C.WIRE, SPEEDS = C.SPEEDS, FPS = C.FPS;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = C.$;
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- pre-load curtain: the bot locker room -------------------------------
  // The stage opens on this scene (see #lockerroom CSS) while the socket /
  // wasm sim boots. The art frames are wired here (their base path is
  // delivery-mode dependent, like the cog art); the first ingested frame
  // calls dismissLockerRoom(), which fades the room out after a short
  // minimum dwell (a sub-second load would otherwise flash the scene like
  // a glitch).
  var lockerEl = $('lockerroom');
  var LOCKER_MIN_DWELL_MS = 900;
  var lockerShownAt = Date.now();
  var lockerCapTimer = null, lockerGone = false;
  (function buildLockerRoom() {
    // Scene art (nanobanana generations, like the shell's dungeon walls):
    // bg.jpg is the empty-room plate; each bot is five freestanding alpha
    // sprites (<bot>_<pose>.webp) cut from the generated pose frames. Same
    // three-delivery-modes path story as the cog art, so the base derives
    // from COG_BASE: native "<prefix>/client" + "/art/lockerroom", static
    // bundle "./art/lockerroom".
    var artBase = COG_BASE + '/art/lockerroom';
    $('lk-bg').src = artBase + '/bg.jpg';

    // Sprite geometry baked by the extraction script (scripts prompt in the
    // PR): ax/ay anchor each bot's bottom-center on the plate, w/h size each
    // pose — all in % of the 992x926 plate, so everything scales together.
    // Distinct cycle lengths keep the four carousels out of phase; the
    // composed scene state repeats only every few minutes.
    var LK_BOTS = {
      green:  { ax: 22.83, ay: 76.67, cyc: 4.6,

    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, ok: rect.width > 0 };
  }

  // A trackpad PINCH reaches a browser as a wheel event with ctrlKey set (no
  // ctrl key is actually held) — that, and only that, is the wheel we take.
  // Everything else falls through to the page exactly as if the board were an
  // image. preventDefault on this one also suppresses the browser's own
  // ctrl+wheel page zoom, which would otherwise fight the board zoom.

  // absolute scale factor from the gesture's start; `gesturing` keeps the two
  // paths from both firing on browsers that send both.

    ev.preventDefault();
    gesturing = true;
    var t = core.getTransform();
    gestureZoom = (t && t.zoom) || 1;
    gestureAt = canvasPoint(ev);
  });
  canvas.addEventListener('gesturechange', function (ev) {
    ev.preventDefault();
    if (!gesturing || !(ev.scale > 0)) return;

    core.setZoom(gestureZoom * ev.scale, a ? a.x : undefined, a ? a.y : undefined);

  canvas.addEventListener('gestureend', function (ev) {
    ev.preventDefault();
    gesturing = false;
  });

  // page while it is fitted (so the board never traps a scroll) and takes it
  // back once zoomed in, where a drag has somewhere to go; pinch-zoom is never
  // in that list, so a second finger always arrives here as a pointer.
  var pinch = new Map();          // pointerId -> {x, y}
  var pinchSpan = 0, pinchMidX = 0, pinchMidY = 0;
  function pinchGeometry() {
    var pts = Array.from(pinch.values());
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      span: Math.max(1, Math.hypot(dx, dy)),
      midX: (pts[0].x + pts[1].x) / 2,
      midY: (pts[0].y + pts[1].y) / 2

  }
  function beginPinch() {
    var g = pinchGeometry();
    pinchSpan = g.span;
    pinchMidX = g.midX;
    pinchMidY = g.midY;
    dragging = false;             // two fingers is a pinch, not a drag
  }

  function syncTouchAction(t) {
    // Fitted: the page owns one-finger drags. Zoomed: the board does.
    canvas.style.touchAction = (t && t.zoom > 1) ? 'none' : 'pan-x pan-y';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'touch') {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) { beginPinch(); return; }
      if (pinch.size > 2) return;
    }
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = 0;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
  });
  window.addEventListener('pointermove', function (ev) {
    if (pinch.has(ev.pointerId)) {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) {
        var g = pinchGeometry();
        var rect = canvas.getBoundingClientRect();
        // Zoom by how much the fingers spread, then pan by how far the pair
        // travelled, so the board tracks the hand instead of only the spread.
        core.zoomAt(g.span / pinchSpan, g.midX - rect.left, g.midY - rect.top);
        core.panBy(g.midX - pinchMidX, g.midY - pinchMidY);
        pinchSpan = g.span;
        pinchMidX = g.midX;
        pinchMidY = g.midY;
        dragMoved = 999;          // a pinch must never also select a cog
        return;
      }
    }
    if (!dragging) return;
    var dx = ev.clientX - lastDragX, dy = ev.clientY - lastDragY;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;

  // One arrow press, in LOGICAL map pixels — a fixed cell of ground. 64px is
  // eight of the engine's fog-of-war cells (FovCellSize) and a bit over five
  // cog widths: ~19 cells across the 1235px arena, ~39 across a 2496px 4-team
  // board, so shift (ten cells) crosses either in a couple of presses while a
  // single press is still a step you can aim with.
  var PAN_CELL_MAP_PX = 64;

  // The view is measured in BOARD pixels and a cell is defined in WORLD pixels,
  // and the two differ by the board's supersample factor — which is per-board
  // (an oversize map renders 1x, a normal one at RenderScale), so the server
  // states it per frame as `bs`. Falling back to 1 makes an un-stated board
  // step a cell of board pixels: smaller ground per press, never a broken key.

    var bs = lastState && lastState.bs > 0 ? lastState.bs : 1;

  }
  // GEN-GENERALS-IO: #viewpanel is gone (the board is a fixed grid that
  // relayout() fits whole at every width), so there is no slider, no readout
  // and no minimap to keep in step. broadcast_core tolerates a missing
  // minimap: pendingMinimap stays null. The core's transform is still the
  // single source of truth, and the fog lens is drawn against it.

    t = t || (core && core.getTransform ? core.getTransform() : null);
    if (window.GenGeneralsChrome) window.GenGeneralsChrome.transform(t);

  }

  canvas.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    core.resetView();
  });

  canvas.addEventListener('click', function (ev) {
    // A pan is not a click: dragging the board must never also select the cog
    // that happened to be under the pointer when the drag ended.
    if (dragMoved > 4) { dragMoved = 0; return; }
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';

      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }

  ro.observe(viewport);

  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  GEN_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, activeTeams: activeTeams, teamOf: teamOf,
    teamName: teamName, rosterName: rosterName, shortName: shortName,
    pushFeed: pushFeed, banner: banner, togglePov: togglePov,
    getState: function () { return lastState; }
  };
  if (window.GenGeneralsChrome) window.GenGeneralsChrome.install(GEN_CTX);

  relayout();
  core.start();
})();
</script>
<!--
     GEN-GENERALS-IO additions to the inherited coworld-ctf chrome
     ==============================================================

<style>

/* ---- the commander line: the LLM's own words, in the feed -------------- */

<script>
// GEN-GENERALS-IO game block. It owns the scorebug plate contents, the fog
// lens, the growth bar, the match feed, the banners, the scrubber beats and
// the endcard; the chrome above owns everything else.
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TEAMS = ['red', 'blue', 'green', 'yellow'];
  var TEAM_COLOR = { red: '#e0523a', blue: '#3f7cc4', green: '#45a85e', yellow: '#ddc531' };
  var WIRE = window.GEN_WIRE || {};
  // The context the classic chrome hands this block (its `send`, `pushFeed`,
  // `banner`, `esc` and `getState`). The game block must not re-implement
  // naming, escaping, feed insertion or the transport.
  var CTX = null;
  function install(ctx) { if (ctx) CTX = ctx; }
  var ALIASES = WIRE.aliases || ['RED-alpha', 'BLUE-alpha', 'GREEN-alpha', 'YELLOW-alpha'];

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shortName(n) {

    var at = n.indexOf('@');

  // chrome alias block hoists, and a game-block redefinition would shadow it
  // (the tandem 2026-08-23 hoisting trap).
  function genTeam(seat) { return TEAMS[seat] || 'red'; }
  function upper(seat) { return String(TEAMS[seat] || '').toUpperCase(); }

  // ---- the top band: fog lens + growth bar ------------------------------
  var band = document.createElement('div');
  band.id = 'genband';
  var lensSeat = -1;          // -1 = ALL
  var chips = [];
  (function buildBand() {
    var all = document.createElement('span');
    all.className = 'fogchip on';
    all.innerHTML = '<span class="word">All</span><span class="swatch" style="background:#f2e8d8"></span>';
    all.title = 'Show the whole board';
    all.setAttribute('aria-label', 'Fog lens: show the whole board');
    all.addEventListener('click', function () { setLens(-1); });
    band.appendChild(all);
    chips.push(all);
    for (var seat = 0; seat < 4; seat++) {
      (function (s) {
        var chip = document.createElement('span');
        chip.className = 'fogchip';
        chip.innerHTML = '<span class="swatch" style="background:' + TEAM_COLOR[TEAMS[s]] + '"></span>' +
          '<span class="word">' + upper(s) + '</span>';
        chip.title = 'Fog lens: see the board as ' + ALIASES[s] + ' sees it';
        chip.setAttribute('aria-label', chip.title);
        chip.addEventListener('click', function () { setLens(s); });
        band.appendChild(chip);
        chips.push(chip);

    bar.id = 'growthbar';
    bar.innerHTML = '<i style="width:0%"></i>';
    band.appendChild(bar);
    var read = document.createElement('span');
    read.id = 'growthread';
    read.textContent = 'GROWTH IN —';
    band.appendChild(read);
    var chrome = $('chrome');
    if (chrome) chrome.appendChild(band);
    var clockCol = document.querySelector('.clock-col');
    if (clockCol) {

      stack.id = 'stacktop';
      clockCol.appendChild(stack);
    }
  })();

  function setLens(seat) {
    lensSeat = seat;
    for (var i = 0; i < chips.length; i++) {

    }

  // ---- the board model, derived in the browser from `cells` -------------
  var boardW = 0, boardH = 0;
  var kinds = [], owners = [], armies = [];
  var everSeen = [];          // per seat: accumulated "has ever been seen"
  var transform = null;

  function ensureBoard(s) {
    if (!(s.w > 0) || !(s.h > 0)) return;
    if (boardW === s.w && boardH === s.h) return;
    boardW = s.w; boardH = s.h;
    var n = boardW * boardH;
    kinds = new Array(n); owners = new Array(n); armies = new Array(n);
    everSeen = [];
    for (var seat = 0; seat < 4; seat++) everSeen.push(new Uint8Array(n));

  function applyCells(s) {
    if (!s.cells) return;
    for (var i = 0; i < s.cells.length; i++) {

  // it. The per-seat fog is NOT transmitted: this costs zero replay bytes and
  // cannot drift.
  function visibleFor(seat) {
    var n = boardW * boardH;
    var vis = new Uint8Array(n);
    for (var cell = 0; cell < n; cell++) {
      if (owners[cell] !== seat) continue;
      vis[cell] = 1;
      var x = cell % boardW, y = (cell / boardW) | 0;
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          var nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= boardW || ny >= boardH) continue;

        }
      }
    }
    return vis;
  }

  function fogCanvas() {
    var pool = $('lightpool');
    if (!pool) return null;
    var canvas = $('foglens-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'foglens-canvas';
      pool.appendChild(canvas);
    }
    return canvas;
  }

  function drawFogLens() {
    var canvas = fogCanvas();
    if (!canvas || !boardW) return;
    var pool = $('lightpool');
    var w = pool.clientWidth, h = pool.clientHeight;
    if (!(w > 0) || !(h > 0)) return;
    var dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr)) canvas.width = Math.round(w * dpr);
    if (canvas.height !== Math.round(h * dpr)) canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (lensSeat < 0 || !transform || !(transform.scale > 0)) return;
    var vis = visibleFor(lensSeat);
    var seen = everSeen[lensSeat];
    for (var cell = 0; cell < vis.length; cell++) if (vis[cell]) seen[cell] = 1;
    var cellPx = (WIRE.cellPx || 40) * transform.scale;
    var ox = transform.offsetX, oy = transform.offsetY;
    for (var i = 0; i < vis.length; i++) {
      if (vis[i]) continue;
      var x = ox + (i % boardW) * cellPx;
      var y = oy + (((i / boardW) | 0)) * cellPx;
      ctx.fillStyle = seen[i] ? 'rgba(6, 8, 12, 0.55)' : 'rgba(6, 8, 12, 0.86)';
      ctx.fillRect(x, y, cellPx + 0.5, cellPx + 0.5);
      if (!seen[i]) {

  // Named genBeat so it can never be shadowed by the hoisted alias the shared
  // chrome declares for its own beat builder (the tandem 2026-08-23 hoisting
  // trap: a game-block redefinition wins, and the markers then render as
  // unlabelled divs that never seek).
  var genSeen = {};
  function genBeat(tick, kind, seat, label) {
    var key = tick + '|' + kind + '|' + seat;
    if (genSeen[key]) return;
    genSeen[key] = true;
    var scrub = $('scrub');
    if (!scrub) return;
    var state = CTX ? CTX.getState() : null;
    var st = state ? Math.max(0, state.st || 0) : 0;
    var mx = state ? Math.max(st + 1, state.mx || 1) : 1;
    var frac = Math.min(1, Math.max(0, (tick - st) / (mx - st)));
    var button = document.createElement('button');
    button.className = 'beat-marker ' + kind + (seat >= 0 ? ' ' + genTeam(seat) : '');
    button.style.left = (frac * 100) + '%';
    if (seat >= 0) button.style.setProperty('--tc', TEAM_COLOR[genTeam(seat)]);
    button.title = label;
    button.setAttribute('aria-label', label);
    button.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (CTX) CTX.send('s:' + tick);
    });
    scrub.appendChild(button);
  }

  // ---- the match feed and the banners -----------------------------------
  function cellText(cell) {
    return '(' + (cell % boardW) + ',' + (((cell / boardW) | 0)) + ')';
  }

  function feedRow(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    if (CTX) CTX.pushFeed(row);
  }

  function who(seat) {
    return '<span class="who ' + genTeam(seat) + '">' + esc(upper(seat)) + '</span>';
  }

  function event(e, s, ctx) {
    install(ctx);
    switch (e.k) {
      case 'citytaken':
        feedRow(who(e.seat) + '<span class="glyph">&#9670;</span><span class="badge">takes the city at ' +
          cellText(e.cell) + ' for ' + (e.cost || 0) + '</span>');
        genBeat(s.t, 'citytaken', e.seat, upper(e.seat) + ' takes the city at ' + cellText(e.cell));
        return true;
      case 'generalspotted':
        feedRow(who(e.seat) + '<span class="glyph">&#128065;</span><span class="badge">SEES ' +
          esc(upper(e.victim)) + "'S CROWN at " + cellText(e.cell) + '</span>', 'flagkill');
        genBeat(s.t, 'generalspotted', e.seat,
          upper(e.seat) + " sees " + upper(e.victim) + "'s crown");
        return true;
      case 'generalcaptured':
        if (CTX) {
          CTX.banner(upper(e.seat) + " TAKES " + upper(e.victim) + "'S CROWN — inherits " +
            (e.landGained || 0) + ' tiles and ' + (e.armyGained || 0) + ' armies',
            'wipe accent ' + genTeam(e.seat));
        }
        genBeat(s.t, 'generalcaptured', e.seat,
          upper(e.seat) + " takes " + upper(e.victim) + "'s crown");
        return true;
      case 'eliminated':
        if (CTX) {
          CTX.banner(upper(e.seat) + ' IS ELIMINATED (turn ' + (e.turn || 0) + ')',
            'steal accent ' + genTeam(e.seat));
        }
        return true;
      case 'growth':
        var parts = [];
        for (var seat = 0; seat < 4; seat++) {
          if (e.land && e.land[seat] > 0) parts.push(upper(seat) + ' +' + e.land[seat]);
        }
        if (CTX) {
          CTX.banner('GROWTH — every tile +1 · ' + parts.join(' '), 'returned accent');
        }
        return true;
      case 'stackclash':
        feedRow(who(e.attacker) + '<span class="glyph">&#8594;</span>' +
          (e.defender >= 0 ? who(e.defender) : '<span class="who">neutral</span>') +
          '<span class="badge">' + (e.attackerArmy || 0) + ' against ' + (e.defenderArmy || 0) + '</span>');
        return true;
      case 'claim':
      case 'tilelost':
        return true;
      case 'plan':
        if (e.note) {
          // `plan` rows carry a full sentence (<=160 runes), so they take the
          // wrapping band the CSS above reserves rather than the one-line
          // badge the other feed rows use.
          feedRow('<span class="who ' + genTeam(e.seat) + '">' + esc(ALIASES[e.seat]) +
            '</span><span class="badge">&ldquo;' + esc(e.note) + '&rdquo;</span>', 'plan');
        }
        return true;
      case 'end':
        genBeat(s.t, 'end', -1, 'Final turn');
        return true;
      default:
        return false;
    }
  }

  // ---- the scorebug plate contents --------------------------------------
  function scorebug(s) {
    var stand = s.stand || { land: [0, 0, 0, 0], army: [0, 0, 0, 0], cities: [0, 0, 0, 0] };
    var teams = s.teams || {};
    var tiny = document.getElementById('stage');
    var isTiny = tiny && tiny.classList.contains('tiny');
    for (var seat = 0; seat < 4; seat++) {
      var team = genTeam(seat);
      var nameEl = $('name-' + team);
      var landEl = $('land-' + team);
      var subEl = $('sub-' + team);
      var plate = document.querySelector('.plate[data-team="' + team + '"]');
      var roster = (s.roster || []).filter(function (p) { return p.s === seat; })[0];
      if (nameEl && roster) nameEl.textContent = shortName(roster.name);
      if (landEl) landEl.textContent = String(stand.land[seat]);
      var alive = s.alive ? s.alive[seat] : true;
      var fallbacks = (teams[team] && teams[team].fallbacks) || 0;
      if (subEl) {
        if (!alive) {
          subEl.textContent = 'out t' + ((s.out && s.out[seat] >= 0) ? s.out[seat] : '?');
        } else if (isTiny) {
          subEl.innerHTML = fallbacks > 0 ? '<span class="fbglyph">&#8623;</span>' : '';
        } else {
          subEl.innerHTML = esc(stand.army[seat] + ' army · ' + stand.cities[seat] + ' cities') +
            (fallbacks > 0 ? ' <span class="fbglyph" title="took a scripted fallback">&#8623;</span>' : '');
        }
      }
      if (plate) {
        plate.classList.toggle('out', !alive);
        plate.classList.toggle('leader', alive && isLeader(stand.land, seat));
      }
    }
    var stack = $('stacktop');
    if (stack) {
      var bits = [];
      for (var i = 0; i < 4; i++) {
        if (!s.alive || s.alive[i]) bits.push(upper(i).charAt(0) + ' ' + stand.army[i]);
      }
      stack.textContent = isTiny ? bits.join(' · ') : '';
    }
  }

  function isLeader(land, seat) {
    for (var i = 0; i < 4; i++) if (i !== seat && land[i] >= land[seat]) return false;
    return true;
  }

  // ---- the clock, the growth bar and the frame hook ----------------------
  // The pre-scan ships the whole beat timeline on the first frame, so the
  // scrubber draws at FULL WIDTH immediately instead of growing in.
  var beatsIngested = false;
  function ingestBeatTimeline(s) {
    if (beatsIngested || !s.beats) return;
    beatsIngested = true;
    for (var i = 0; i < s.beats.length; i++) {
      var b = s.beats[i];
      var seat = (b.seat != null && b.seat >= 0) ? b.seat : -1;
      if (b.k === 'citytaken') genBeat(b.t, 'citytaken', seat, upper(seat) + ' takes a city');
      else if (b.k === 'generalspotted') genBeat(b.t, 'generalspotted', seat, upper(seat) + ' finds a crown');
      else if (b.k === 'generalcaptured') genBeat(b.t, 'generalcaptured', seat, upper(seat) + ' takes a crown');
      else if (b.k === 'end') genBeat(b.t, 'end', -1, 'Final turn');
    }
  }

  function frame(s, ctx, jumped) {
    install(ctx);
    ensureBoard(s);
    ingestBeatTimeline(s);
    if (jumped) {
      // A seek re-bases the board: the next frame carries the full array.
      for (var i = 0; i < kinds.length; i++) { kinds[i] = 'plain'; owners[i] = -1; armies[i] = 0; }
    }
    applyCells(s);
    var timeEl = $('clock-time');
    var capEl = $('clock-caption');
    if (timeEl && s.ph === 'playing') {
      timeEl.textContent = 'TURN ' + (s.turn || 0) + ' / ' + (s.turns || 0);
    }
    if (capEl && s.ph === 'playing') {
      var standing = 0;
      var best = 0, bestSeat = 0;
      var stand = s.stand || { land: [0, 0, 0, 0] };
      for (var seat = 0; seat < 4; seat++) {
        if (!s.alive || s.alive[seat]) standing++;
        if (stand.land[seat] > best) { best = stand.land[seat]; bestSeat = seat; }
      }
      var plan = Math.floor((s.turn || 0) / 8) + 1;
      var plans = Math.ceil((s.turns || 240) / 8);
      capEl.textContent = 'plan ' + plan + '/' + plans + ' · ' + standing +
        ' crowns standing · ' + upper(bestSeat) + ' leads ' + best + ' land';
    }
    var bar = $('growthbar');
    var read = $('growthread');
    if (bar && read && s.growthEvery > 0) {
      var into = s.growthEvery - (s.growthIn || s.growthEvery);
      bar.firstChild.style.width = Math.round(100 * into / s.growthEvery) + '%';
      read.textContent = 'GROWTH IN ' + (s.growthIn || 0);
    }
    for (var seat2 = 0; seat2 < 4; seat2++) {
      if (chips[seat2 + 1]) {
        chips[seat2 + 1].classList.toggle('out', !!(s.alive && !s.alive[seat2]));
      }
    }
    drawFogLens();
  }

  function transformUpdate(t) {
    transform = t || null;
    drawFogLens();
  }

  // ---- the endcard -------------------------------------------------------
  function endcard(s) {
    var o = s.over;
    if (!o) return;
    var wrap = $('ec-teams');
    var head = $('ec-headline');
    var how = $('ec-how');
    var cond = $('ec-wincond');
    var stand = s.stand || { land: [0, 0, 0, 0], army: [0, 0, 0, 0], cities: [0, 0, 0, 0] };
    var key = [s.t, o.winner, o.draw, o.endRule].join('|');
    if (wrap && wrap._key !== key) {
      wrap._key = key;
      // ONE four-seat table under the re-mapped header, not one panel per
      // team: four stacked panels do not fit a 360 px embed.
      var html = '<div class="ec-team" id="ec-team-all">' +
        '<div class="ec-thead"><span>Commander</span><span>Land</span>' +
        '<span>Army</span><span>Cities</span><span>Crowns</span></div>';
      var order = [0, 1, 2, 3].sort(function (a, b) {
        return ((o.rank && o.rank[a] != null) ? o.rank[a] : a) -
               ((o.rank && o.rank[b] != null) ? o.rank[b] : b);
      });
      for (var idx = 0; idx < order.length; idx++) {
        var seat = order[idx];
        var team = genTeam(seat);
        var roster = (s.roster || []).filter(function (p) { return p.s === seat; })[0];
        var alive = s.alive ? s.alive[seat] : true;
        var crowns = 0;
        for (var v = 0; v < 4; v++) if (s.outBy && s.outBy[v] === seat) crowns++;
        html += '<div class="ec-row' + (alive ? '' : ' ec-out') +
          (o.winner === team ? ' mvp' : '') + '">' +
          '<span class="pcell"><span class="pname ' + team + '">' +
          esc(roster ? shortName(roster.name) : upper(seat)) + '</span>' +
          '<span class="ec-alias"> ' + esc(ALIASES[seat]) +
          (alive ? '' : ' · out t' + ((s.out && s.out[seat] >= 0) ? s.out[seat] : '?')) +
          '</span></span>' +
          '<span class="n">' + stand.land[seat] + '</span>' +
          '<span class="n">' + stand.army[seat] + '</span>' +
          '<span class="n">' + stand.cities[seat] + '</span>' +
          '<span class="n">' + crowns + '</span>' +
          '</div>';
      }
      wrap.innerHTML = html + '</div>';
    }
    if (cond) {
      cond.textContent =
        o.endRule === 'conquest' ? 'LAST CROWN STANDING' :
        o.endRule === 'wall_clock' ? 'WALL-CLOCK STOP' :
        (o.endRule === 'sim_fault' || o.endRule === 'host_error') ? 'FAULT — NO RESULT' :
        'FULL TIME — RANKED ON LAND';
    }
    if (head) {
      if (o.draw) {
        head.className = 'headline draw';
        head.textContent = 'DEAD EVEN';
      } else {
        var seatIndex = TEAMS.indexOf(o.winner);
        var rosterWin = (s.roster || []).filter(function (p) { return p.s === seatIndex; })[0];
        head.className = 'headline ' + o.winner;
        head.textContent = 'GENERALS — ' +
          esc(rosterWin ? shortName(rosterWin.name).toUpperCase() : upper(seatIndex)) + ' WINS';
      }
    }
    if (how) {
      var crowns = 0;
      for (var i = 0; i < 4; i++) if (s.out && s.out[i] >= 0) crowns++;
      how.textContent = crowns > 0
        ? crowns + ' crown' + (crowns === 1 ? '' : 's') + ' fell; the survivors were ranked on land, then army, then cities.'
        : 'No crown fell: the clock ran out and the ranking is land, then army, then cities.';
    }
  }

  window.GenGeneralsChrome = {
    install: install,
    frame: frame,
    event: event,
    scorebug: scorebug,
    endcard: endcard,
    transform: transformUpdate,
    beat: genBeat
  };
  window.addEventListener('resize', drawFogLens);
})();
</script>
</body>
</html>
